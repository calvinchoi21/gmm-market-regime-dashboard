name: Quarterly GMM Model Retrain

on:
  # Run on 1st of January, April, July, October at 6:00 AM UTC
  schedule:
    - cron: '0 6 1 1,4,7,10 *'
  # Also allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create cache directory
        run: mkdir -p cache

      - name: Retrain GMM model
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python gmm_pipeline.py --retrain

      - name: Commit updated model to repo
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add cache/gmm_model.joblib cache/regime_mapping.json
          git diff --staged --quiet || git commit -m "Quarterly GMM model retrain [$(date +'%Y-%m-%d')]"
          git push
